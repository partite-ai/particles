# Test workflow: runs on every pull request and on every push to
# main. Pure Go — the wasm components live in the repo (see
# README "Building the project"), so CI doesn't need the Rust /
# npm / wasm-rquickjs toolchain.
#
# Action versions are pinned to commit SHAs (not tags) so a
# compromised tag can't silently swap implementations into our
# pipeline. The trailing `# <name>@<version>` comment is what
# Dependabot uses to bump these — see .github/dependabot.yml.
# To upgrade a pinned action by hand:
#   1. Find the new commit SHA for the desired tag:
#        gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#   2. Replace the SHA and update the version in the trailing
#      comment.
name: Test

on:
  pull_request:
  push:
    branches: [main]

# Default to no permissions; each job opts in to what it needs.
# Reduces the blast radius of a compromised action.
permissions: {}

# Cancel in-flight runs only on pull-request pushes — pushes to
# main keep going so we don't miss a regression that lands between
# rapid merges.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # actions/setup-go@v6.5.0
        with:
          # Read the toolchain directive from go.mod so a bump
          # there propagates here without a workflow edit.
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        # -short skips tests that need network / external systems
        # (npm registry fetches, etc.); -race finds data races
        # while we're at it; -count=1 disables the test cache so
        # CI always re-runs.
        run: go test -short -race -timeout 30m -count=1 ./...
