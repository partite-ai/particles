# Release workflow: builds cross-platform binaries and creates a
# DRAFT GitHub release with the archives attached. Trigger it
# manually (Actions → Release → Run workflow) with a SemVer version
# like v0.1.0; review the draft + generated notes, then click
# Publish. Publishing is what creates the git tag — drafts don't —
# so CI is the sole release creator and the tag is born at publish,
# which is why there's no tag/release "already exists" collision.
# No third-party release actions — `gh release create` does the
# upload with one fewer dependency to keep pinned.
#
# The release is built from the commit the workflow runs against
# (the branch picked in the Run-workflow dialog; the default branch
# otherwise) and the tag is pinned to that commit on publish via
# --target. The embedded artifacts are committed and picked up from
# that tree: the wasm components under runtime/embed and
# internal/build/wacogo/embed, and the Windows `particle link`
# launcher stubs under cmd/particle/winstub. Always rebuild & commit
# those (`make` + `make win-trampoline`) BEFORE running this.
#
# Pinning + upgrade procedure: see test.yml header.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, SemVer tag form (e.g. v0.1.0 or v1.2.3-rc.1)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Required for `gh release create` to create the draft,
      # upload the binaries, and write the release body.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The trigger no longer enforces the tag shape (it did when
          # this ran on tag push), so validate the free-form input
          # against the same SemVer pattern before it becomes a tag.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::version '$VERSION' is not a SemVer tag (expected v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cross-platform binaries
        env:
          # Version label baked into archive names (e.g. v1.2.3).
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Each line is "<goos> <goarch> <archive-ext>". Extend
          # by adding rows; the build loop below is shape-driven.
          while read -r GOOS GOARCH EXT; do
            BIN=particle
            [ "$GOOS" = "windows" ] && BIN=particle.exe
            STAGE="dist/staging/particle-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "$STAGE"
            echo "==> building ${GOOS}/${GOARCH}"
            # -trimpath strips local filesystem paths; -s -w drops
            # the symbol & DWARF tables (smaller binary, no debug
            # info — fine for a release artifact).
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w" \
              -o "$STAGE/$BIN" ./cmd/particle
            cp README.md "$STAGE/"
            cp LICENSE  "$STAGE/" 2>/dev/null || true
            cd dist
            if [ "$EXT" = "zip" ]; then
              (cd staging && zip -r "../particle-${VERSION}-${GOOS}-${GOARCH}.zip" "particle-${VERSION}-${GOOS}-${GOARCH}")
            else
              tar -czf "particle-${VERSION}-${GOOS}-${GOARCH}.tar.gz" -C staging "particle-${VERSION}-${GOOS}-${GOARCH}"
            fi
            cd ..
          done <<'PLATFORMS'
          linux   amd64 tar.gz
          linux   arm64 tar.gz
          darwin  amd64 tar.gz
          darwin  arm64 tar.gz
          windows amd64 zip
          windows arm64 zip
          PLATFORMS
          rm -rf dist/staging
          # Single SHA256SUMS file alongside the archives — what
          # users verify against; no per-archive sidecars to lose.
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          ls -la dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          # Pin the eventual tag to the exact commit we built from.
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Mark anything with a "-" suffix (v1.2.3-rc.1) as a
          # prerelease so it doesn't become "latest" on publish.
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # Idempotent: a re-run for the same version refreshes the
          # draft's assets instead of failing on "already exists".
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists — refreshing its assets"
            gh release upload "$VERSION" \
              dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            # --draft: no git tag is created until you click Publish.
            # --target: pins that tag to the built commit on publish.
            gh release create "$VERSION" \
              --draft \
              --target "$TARGET" \
              --title "$VERSION" \
              --generate-notes \
              $PRERELEASE_FLAG \
              dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          fi
