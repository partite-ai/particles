[package]
name = "pip-resolve-component"
version = "0.1.0"
edition = "2021"
publish = false
description = "Resolves PEP 508 requirements and fetches pure-Python wheels from PyPI, as a WASI Preview 2 component."

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindings (export trait generation). wasi:http imports come from
# wstd, which already declares them — the produced component picks them
# up automatically.
wit-bindgen = "0.39"

# Python packaging primitives + version solver. All compile cleanly
# to wasm32-wasip2.
pep508_rs = "0.9"
pep440_rs = "0.7"
pubgrub   = "0.3"

# HTTP / async stack on top of wasi:http. Same crate the deno-npm
# component uses — keeps the two build-time wasms close in shape.
wstd = { version = "0.5", default-features = false }

# Serialization for PyPI JSON responses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# sha256 verification of fetched wheels.
sha2 = "0.10"
hex = "0.4"

# Reading `Requires-Dist` out of a local wheel's dist-info/METADATA
# (a wheel is a zip archive). default-features off keeps it to the
# deflate path — no aes/bzip2/zstd backends — so it stays small and
# compiles clean to wasm32-wasip2.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
